name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/firestore.rules'
      - 'infrastructure/firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    name: Deploy Firestore Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment
        run: npx tsx scripts/deploy/validate-env.ts
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Firestore rules
        run: npx firebase deploy --only firestore:rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Firestore indexes
        run: npx firebase deploy --only firestore:indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deployment summary
        if: success()
        run: |
          echo "### 🔒 Firestore Rules & Indexes Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ secrets.FIREBASE_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "**Firestore Console:** https://console.firebase.google.com/project/${{ secrets.FIREBASE_PROJECT_ID }}/firestore" >> $GITHUB_STEP_SUMMARY
