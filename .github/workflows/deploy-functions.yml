name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'apps/functions/**'
      - 'libs/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    name: Deploy to Cloud Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run pre-deployment checks
        run: npx tsx scripts/deploy/pre-deploy.ts
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Build Cloud Functions
        run: npx nx build functions

      - name: Deploy to Cloud Functions
        run: npx firebase deploy --only functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deployment summary
        if: success()
        run: |
          echo "### ⚡ Cloud Functions Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ secrets.FIREBASE_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "**Firebase Console:** https://console.firebase.google.com/project/${{ secrets.FIREBASE_PROJECT_ID }}/functions" >> $GITHUB_STEP_SUMMARY
